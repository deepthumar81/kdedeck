name: kdedeck_mobile
description: "KdeDeck - Native Flutter Controller App for Linux & Mac"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.0
  wakelock_plus: 1.2.8
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  flutter_staggered_grid_view: ^0.7.0
  window_manager: ^0.4.3
  flutter_svg: ^2.3.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
