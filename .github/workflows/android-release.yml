name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KDEDECK_ANDROID_SIGNING_REQUIRED: 'true'
      KDEDECK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KDEDECK_ANDROID_KEYSTORE_PASSWORD }}
      KDEDECK_ANDROID_KEY_ALIAS: ${{ secrets.KDEDECK_ANDROID_KEY_ALIAS }}
      KDEDECK_ANDROID_KEY_PASSWORD: ${{ secrets.KDEDECK_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Materialize private keystore
        env:
          KDEDECK_ANDROID_KEYSTORE_BASE64: ${{ secrets.KDEDECK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$KDEDECK_ANDROID_KEYSTORE_BASE64"
          test -n "$KDEDECK_ANDROID_KEYSTORE_PASSWORD"
          test -n "$KDEDECK_ANDROID_KEY_ALIAS"
          test -n "$KDEDECK_ANDROID_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/kdedeck-release.jks"
          printf '%s' "$KDEDECK_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "KDEDECK_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          dart pub get --directory deckboard_daemon/backend --enforce-lockfile
          flutter pub get --directory kdedeck_mobile --enforce-lockfile

      - name: Verify release metadata
        run: make release-check

      - name: Compile daemon release artifact
        run: |
          mkdir -p artifacts
          dart compile exe deckboard_daemon/backend/bin/backend.dart \
            -o artifacts/kdedeck_daemon

      - name: Build signed Android release
        working-directory: kdedeck_mobile
        run: flutter build apk --release

      - name: Collect and validate production alpha release
        run: |
          set -eu
          mkdir -p artifacts
          cp kdedeck_mobile/build/app/outputs/flutter-apk/app-release.apk artifacts/app-release.apk
          KDEDECK_RELEASE_TAG="$GITHUB_REF_NAME" \
            make alpha-release-check ARTIFACT_DIR=artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/app-release.apk --generate-notes
