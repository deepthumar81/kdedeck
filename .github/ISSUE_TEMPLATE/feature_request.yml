name: Feature request
description: Suggest a focused improvement for KDE Deck.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Linux daemon
        - Browser configurator
        - Flutter client
        - Go tray
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Project fit
      options:
        - label: I have checked the roadmap and existing issues.
          required: true
        - label: I understand Linux-first support and platform limitations.
          required: true
