<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>KdeDeck Controller</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="theme-breeze-dark">

  <!-- Header & Navigation -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      </div>
      <span>KdeDeck</span>
    </div>

    <div class="board-navigation">
      <div class="page-indicator" id="pageDots"></div>
    </div>

    <div style="display: flex; gap: 8px;">
      <button class="action-btn" id="editToggleBtn" onclick="toggleEditMode()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span id="editBtnText">Edit</span>
      </button>
      <button class="action-btn" onclick="cycleTheme()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 0 0 0 14 7 7 0 0 0 0-14z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Multi-Board Swipe Wrapper -->
  <main id="mainContainer">
    <div class="boards-wrapper" id="boardsContainer"></div>
  </main>

  <!-- Button / Board Editor Modal -->
  <div class="modal-overlay" id="editorModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Edit Item</div>
        <button class="action-btn" onclick="closeModal()" style="padding: 4px 8px;">✕</button>
      </div>

      <div class="form-group">
        <label>Button Label</label>
        <input type="text" id="editLabel" class="form-input" placeholder="e.g. Play Music">
      </div>

      <div class="form-group">
        <label>Action Type</label>
        <select id="editActionType" class="form-select" onchange="onActionTypeChange()">
          <option value="launch_app">Launch Application</option>
          <option value="open_url">Open Website URL</option>
          <option value="audio_volume">Audio Volume Slider</option>
          <option value="brightness">Brightness Slider</option>
          <option value="audio_mute_toggle">Toggle Mute</option>
          <option value="mpris_action">Media Control (Play/Pause/Next)</option>
          <option value="kdeconnect_ring">KDE Connect Find Phone</option>
          <option value="kde_action">KDE Plasma Action</option>
        </select>
      </div>

      <div class="form-group" id="payloadGroup">
        <label id="payloadLabel">Payload (App Name or URL)</label>
        <input type="text" id="editPayload" class="form-input" placeholder="e.g. firefox or https://youtube.com">
      </div>

      <div class="form-group">
        <label>Icon</label>
        <select id="editIcon" class="form-select">
          <option value="terminal">Terminal</option>
          <option value="folder">Folder</option>
          <option value="globe">Globe (Web)</option>
          <option value="music">Music</option>
          <option value="play">Play</option>
          <option value="volume-2">Volume</option>
          <option value="sun">Sun (Brightness)</option>
          <option value="moon">Moon (Night Light)</option>
          <option value="lock">Lock</option>
          <option value="settings">Settings</option>
          <option value="smartphone">Smartphone</option>
          <option value="bell">Bell</option>
          <option value="window">Window</option>
        </select>
      </div>

      <div class="form-group">
        <label>Color Theme</label>
        <select id="editColor" class="form-select">
          <option value="gradient-blue">Blue</option>
          <option value="gradient-purple">Purple</option>
          <option value="gradient-emerald">Emerald</option>
          <option value="gradient-red">Red</option>
          <option value="gradient-amber">Amber</option>
          <option value="gradient-pink">Pink</option>
          <option value="gradient-teal">Teal</option>
          <option value="gradient-orange">Orange</option>
          <option value="gradient-indigo">Indigo</option>
          <option value="gradient-slate">Slate</option>
        </select>
      </div>

      <div class="modal-actions">
        <button class="action-btn" onclick="closeModal()">Cancel</button>
        <button class="action-btn" style="background: var(--accent);" onclick="saveItemChanges()">Save Item</button>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
