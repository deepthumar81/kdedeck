<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>KDE DECK Controller</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="theme-neon-cyberdeck">

  <!-- Toast Notification Banners -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Hidden Import File Input -->
  <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="handleImportFile(event)">

  <!-- Left Sliding Drawer Menu -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
    <div class="drawer-content" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <span>KDE DECK MENU</span>
        <button class="hamburger-btn" onclick="toggleDrawer()" style="width: 28px; height: 28px; font-size: 0.9rem;">✕</button>
      </div>

      <button class="drawer-item" id="drawerEditBtn" onclick="toggleEditMode(); toggleDrawer();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        <span id="drawerEditBtnText">Edit Mode</span>
      </button>

      <button class="drawer-item" onclick="addNewItemToBoard(); toggleDrawer();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>+ Add Button</span>
      </button>

      <button class="drawer-item" onclick="addNewBoard(); toggleDrawer();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        <span>+ Add Board</span>
      </button>

      <button class="drawer-item" onclick="exportConfig(); toggleDrawer();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Export Configuration</span>
      </button>

      <button class="drawer-item" onclick="triggerImportConfig(); toggleDrawer();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Import Configuration</span>
      </button>

      <button class="drawer-item" onclick="cycleTheme();">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a7 7 0 0 0 0 14 7 7 0 0 0 0-14z"/></svg>
        <span>Cycle Theme Mode</span>
      </button>

      <button class="drawer-item" onclick="openSettingsModal(); toggleDrawer();" style="margin-top: 6px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>⚙️ Advanced Settings</span>
      </button>

      <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border-card); color: var(--text-muted); font-size: 0.8rem;">
        <div>KdeDeck v1.1.1</div>
        <div>PIN: <span id="displayPin">8484</span></div>
      </div>
    </div>
  </div>

  <!-- Header & Status Bar (Matching Reference Image 1) -->
  <header>
    <div class="brand-section">
      <button class="hamburger-btn" onclick="toggleDrawer()">☰</button>
      <span class="brand-title">KDE DECK</span>
    </div>

    <!-- Carousel Board Navigation -->
    <div class="board-navigation">
      <button class="carousel-btn" onclick="prevBoard()" title="Previous Board">‹</button>
      <div class="page-indicator" id="pageDots"></div>
      <button class="carousel-btn" onclick="nextBoard()" title="Next Board">›</button>
    </div>

    <!-- Status Badge (Matching Reference Image 1) -->
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="statusText">DECK CONTROL: Synced</span>
    </div>
  </header>

  <!-- Main Multi-Board Swipe / Carousel Wrapper -->
  <main id="mainContainer">
    <div class="boards-wrapper" id="boardsContainer"></div>
  </main>

  <!-- Advanced Settings Modal (Access via Burger Menu ⚙️) -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card" style="max-width: 440px;">
      <div class="modal-header">
        <div class="modal-title">⚙️ Advanced Deck Settings</div>
        <button class="action-btn" onclick="closeSettingsModal()" style="padding: 4px 8px;">✕</button>
      </div>

      <div class="form-group">
        <label>Grid Matrix Columns (e.g. 4, 5, 6, 8)</label>
        <input type="number" id="settingsGridCols" class="form-input" min="2" max="10" value="4">
      </div>

      <div class="form-group">
        <label>Grid Matrix Rows (e.g. 3, 4, 6, 7, 8)</label>
        <input type="number" id="settingsGridRows" class="form-input" min="2" max="10" value="3">
      </div>

      <div class="form-group">
        <label>Show System Metrics Panel (Reference Image 1 Layout)</label>
        <select id="settingsShowMetrics" class="form-select">
          <option value="true">Show Left Metrics Panel (CPU/GPU/RAM)</option>
          <option value="false">Hide Left Metrics Panel (Full Grid Only)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Security PIN</label>
        <input type="text" id="settingsPin" class="form-input" placeholder="8484">
      </div>

      <div class="modal-actions">
        <button class="action-btn" onclick="closeSettingsModal()">Cancel</button>
        <button class="action-btn" style="background: var(--accent);" onclick="saveAdvancedSettings()">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Security PIN Auth Modal -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal-card" style="text-align: center; max-width: 380px;">
      <div class="modal-title">🔐 KdeDeck Security</div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Enter the Security PIN displayed on your PC to authorize this device.</p>
      
      <div class="form-group" style="margin-top: 10px;">
        <input type="password" id="inputPin" class="form-input" placeholder="Enter PIN (e.g. 8484)" style="text-align: center; font-size: 1.4rem; letter-spacing: 4px;">
      </div>

      <div class="modal-actions" style="justify-content: center;">
        <button class="action-btn" style="background: var(--accent); width: 100%; justify-content: center; padding: 12px;" onclick="submitPinAuth()">Connect Device</button>
      </div>
    </div>
  </div>

  <!-- Board Renaming Modal -->
  <div class="modal-overlay" id="boardRenameModal">
    <div class="modal-card" style="max-width: 400px;">
      <div class="modal-header">
        <div class="modal-title">Rename Board</div>
        <button class="action-btn" onclick="closeBoardRenameModal()" style="padding: 4px 8px;">✕</button>
      </div>
      <div class="form-group">
        <label>Board Title</label>
        <input type="text" id="editBoardTitleInput" class="form-input" placeholder="e.g. Gaming or Media">
      </div>
      <div class="modal-actions">
        <button class="action-btn" onclick="closeBoardRenameModal()">Cancel</button>
        <button class="action-btn" style="background: var(--accent);" onclick="saveBoardTitle()">Save Title</button>
      </div>
    </div>
  </div>

  <!-- Button Item Editor Modal -->
  <div class="modal-overlay" id="editorModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Edit Button Item</div>
        <button class="action-btn" onclick="closeModal()" style="padding: 4px 8px;">✕</button>
      </div>

      <div class="form-group">
        <label>Pick Installed Application (APT / Flatpak / Snap)</label>
        <select id="systemAppPicker" class="form-select" onchange="onSystemAppPick()">
          <option value="">-- Choose Installed Application --</option>
        </select>
      </div>

      <div class="form-group">
        <label>Button Label</label>
        <input type="text" id="editLabel" class="form-input" placeholder="e.g. Play Music">
      </div>

      <div class="form-group">
        <label>Action Type</label>
        <select id="editActionType" class="form-select" onchange="onActionTypeChange()">
          <option value="launch_app">Launch Application</option>
          <option value="open_url">Open Website URL</option>
          <option value="audio_volume">Audio Volume Slider</option>
          <option value="brightness">Brightness Slider</option>
          <option value="audio_mute_toggle">Toggle Mute Audio</option>
          <option value="mpris_action">Media Control (Play/Pause/Next)</option>
          <option value="kdeconnect_ring">KDE Connect Find Phone</option>
          <option value="kde_action">KDE Plasma System Action</option>
        </select>
      </div>

      <div class="form-group" id="payloadGroup">
        <label id="payloadLabel">Payload (App Command / URL / Action)</label>
        <input type="text" id="editPayload" class="form-input" placeholder="e.g. firefox or https://youtube.com">
      </div>

      <div class="form-group" id="kdeActionPresetGroup" style="display: none;">
        <label>Select KDE System Preset</label>
        <select id="kdeActionPreset" class="form-select" onchange="document.getElementById('editPayload').value = this.value">
          <option value="toggle_nightlight">Toggle Night Light</option>
          <option value="lock_screen">Lock Screen</option>
          <option value="mute_mic">Mute Microphone</option>
          <option value="screenshot">Take Screenshot</option>
          <option value="show_desktop">Show Desktop</option>
          <option value="overview">Overview Grid</option>
          <option value="present_windows">Present Windows (Expose)</option>
          <option value="sleep_suspend">Sleep / Suspend System</option>
        </select>
      </div>

      <div class="form-group">
        <label>Icon Name (System App Icon or Lucide Name)</label>
        <input type="text" id="editIcon" class="form-input" placeholder="e.g. firefox, terminal, sun, volume-2">
      </div>

      <div class="form-group">
        <label>Neon Border Accent</label>
        <select id="editColor" class="form-select">
          <option value="neon-green">Neon Green</option>
          <option value="neon-blue">Neon Blue</option>
          <option value="neon-cyan">Neon Cyan</option>
          <option value="neon-purple">Neon Purple</option>
          <option value="neon-pink">Neon Pink</option>
          <option value="neon-amber">Neon Amber</option>
          <option value="neon-red">Neon Red</option>
          <option value="neon-orange">Neon Orange</option>
          <option value="neon-yellow">Neon Yellow</option>
          <option value="neon-slate">Neon Slate</option>
        </select>
      </div>

      <div class="modal-actions" style="justify-content: space-between;">
        <button class="action-btn" style="background: rgba(239, 68, 68, 0.2); border-color: #ef4444; color: #ef4444;" onclick="deleteCurrentItem()">Delete Item</button>
        <div>
          <button class="action-btn" onclick="closeModal()">Cancel</button>
          <button class="action-btn" style="background: var(--accent);" onclick="saveItemChanges()">Save Item</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
